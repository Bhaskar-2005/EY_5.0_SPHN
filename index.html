<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="Bhaskar" content="width=device-width, initial-scale=1.0">
	<title>bhaskar</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #1d2925;
			--muted: #718078;
			--paper: #f3f5ed;
			--line: #dbe1d8;
			--lime: #c9f06d;
			--orange: #ff775a;
			--white: #ffffff;
		}

		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--paper); font-family: Manrope, sans-serif; }
		header { padding: 28px 5vw 0; border-bottom: 1px solid var(--line); background: var(--paper); }
		.nav { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: auto; }
		.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
		.brand-mark { width: 24px; height: 24px; display: grid; place-items: center; color: var(--ink); background: var(--lime); border-radius: 50%; font-size: 12px; }
		.nav-label { color: var(--muted); font: 12px 'DM Mono', monospace; text-transform: uppercase; }
		.hero { max-width: 1400px; margin: auto; padding: 92px 0 70px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 40px; align-items: end; }
		h1 { max-width: 850px; margin: 0; font-size: clamp(3.4rem, 8vw, 8.5rem); line-height: .88; letter-spacing: -.07em; font-weight: 800; }
		.hero-copy { padding-bottom: 5px; color: var(--muted); font-size: 15px; line-height: 1.7; }
		.hero-copy strong { display: block; margin-bottom: 14px; color: var(--ink); font: 12px 'DM Mono', monospace; text-transform: uppercase; }
		main { max-width: 1400px; margin: auto; padding: 30px 5vw 80px; }
		.toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) 190px 190px; gap: 12px; margin-bottom: 32px; }
		.control { min-height: 48px; padding: 0 16px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink); background: var(--white); font: inherit; }
		.control:focus { outline: 2px solid var(--orange); outline-offset: 2px; }
		.count { align-self: center; color: var(--muted); font: 12px 'DM Mono', monospace; text-transform: uppercase; }
		.products { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 16px; }
		.product { position: relative; display: flex; flex-direction: column; min-width: 0; animation: rise .45s both; }
		.product-image { position: relative; display: grid; place-items: center; aspect-ratio: 1 / 1.06; padding: 26px; overflow: hidden; background: var(--white); }
		.product-image img { width: 78%; height: 78%; object-fit: contain; mix-blend-mode: multiply; transition: transform .35s ease; }
		.product:hover .product-image img { transform: scale(1.06) rotate(-2deg); }
		.tag { position: absolute; top: 12px; left: 12px; padding: 6px 8px; color: var(--ink); background: var(--lime); font: 10px 'DM Mono', monospace; text-transform: uppercase; }
		.product-info { padding: 15px 2px 0; }
		.category { color: var(--muted); font: 10px 'DM Mono', monospace; text-transform: uppercase; }
		.product-title { min-height: 44px; margin: 8px 0 12px; font-size: 14px; line-height: 1.55; font-weight: 700; }
		.product-bottom { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 11px; }
		.price { font: 15px 'DM Mono', monospace; }
		.rating { color: var(--muted); font: 11px 'DM Mono', monospace; }
		.state { grid-column: 1 / -1; padding: 80px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); }
		.state strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 18px; }
		.retry { margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 2px; color: var(--white); background: var(--orange); font: 12px 'DM Mono', monospace; cursor: pointer; text-transform: uppercase; }
		footer { display: flex; justify-content: space-between; max-width: 1400px; margin: 0 auto; padding: 20px 5vw 30px; color: var(--muted); border-top: 1px solid var(--line); font: 11px 'DM Mono', monospace; text-transform: uppercase; }
		@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 900px) { .hero { grid-template-columns: 1fr; padding: 65px 0 48px; } .hero-copy { max-width: 420px; } .products { grid-template-columns: repeat(3, 1fr); } }
		@media (max-width: 620px) { header, main { padding-left: 20px; padding-right: 20px; } footer { padding-left: 20px; padding-right: 20px; } .nav-label { display: none; } .toolbar { grid-template-columns: 1fr; } .products { grid-template-columns: repeat(2, 1fr); gap: 28px 12px; } .product-image { padding: 16px; } h1 { font-size: 3.6rem; } }
	</style>
</head>
<body>
	<header>
		<nav class="nav" aria-label="Main navigation">
			<div class="brand"><span class="brand-mark">F</span> Field &amp; Form</div>
			<div class="nav-label">Product archive / 2026</div>
		</nav>
		<div class="hero">
			<h1>Good things,<br><em>carefully found.</em></h1>
			<div class="hero-copy"><strong>01 / The collection</strong> A considered edit of everyday objects, unusual details, and things worth keeping around.</div>
		</div>
	</header>
	<main>
		<div class="toolbar" aria-label="Product filters">
			<input class="control" id="search" type="search" placeholder="Search the collection..." aria-label="Search products">
			<select class="control" id="category" aria-label="Filter by category"><option value="all">All categories</option></select>
			<select class="control" id="sort" aria-label="Sort products"><option value="featured">Sort: Featured</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="rating">Rating</option></select>
		</div>
		<div class="count" id="count">Loading collection...</div>
		<section class="products" id="products" aria-live="polite">
			<div class="state"><strong>Gathering the collection</strong>Please wait a moment.</div>
		</section>
	</main>
	<footer><span>Field &amp; Form</span><span>Made for curious people</span></footer>
	<script>
		const productsElement = document.querySelector('#products');
		const searchElement = document.querySelector('#search');
		const categoryElement = document.querySelector('#category');
		const sortElement = document.querySelector('#sort');
		const countElement = document.querySelector('#count');
		let products = [];

		async function fetchProducts() {
			productsElement.innerHTML = '<div class="state"><strong>Gathering the collection</strong>Please wait a moment.</div>';
			countElement.textContent = 'Loading collection...';
			try {
				const response = await fetch('https://fakestoreapi.com/products');
				if (!response.ok) throw new Error('Request failed');
				products = await response.json();
				const categories = [...new Set(products.map(product => product.category))].sort();
				categoryElement.innerHTML = '<option value="all">All categories</option>' + categories.map(category => `<option value="${category}">${category}</option>`).join('');
				renderProducts();
			} catch (error) {
				countElement.textContent = 'Collection unavailable';
				productsElement.innerHTML = '<div class="state"><strong>We could not reach the collection.</strong>Check your connection and try again.<br><button class="retry" type="button" onclick="fetchProducts()">Try again</button></div>';
			}
		}

		function renderProducts() {
			const query = searchElement.value.toLowerCase().trim();
			const selectedCategory = categoryElement.value;
			let visibleProducts = products.filter(product => (selectedCategory === 'all' || product.category === selectedCategory) && `${product.title} ${product.description}`.toLowerCase().includes(query));
			if (sortElement.value === 'low') visibleProducts.sort((a, b) => a.price - b.price);
			if (sortElement.value === 'high') visibleProducts.sort((a, b) => b.price - a.price);
			if (sortElement.value === 'rating') visibleProducts.sort((a, b) => b.rating.rate - a.rating.rate);
			countElement.textContent = `${visibleProducts.length} of ${products.length} objects`;
			productsElement.innerHTML = visibleProducts.length ? visibleProducts.map((product, index) => `
				<article class="product" style="animation-delay: ${index * 45}ms">
					<div class="product-image"><span class="tag">${product.category}</span><img src="${product.image}" alt="${product.title}" loading="lazy"></div>
					<div class="product-info"><div class="category">No. ${String(product.id).padStart(2, '0')}</div><h2 class="product-title">${product.title}</h2><div class="product-bottom"><span class="price">$${product.price.toFixed(2)}</span><span class="rating">${product.rating.rate} / 5 (${product.rating.count})</span></div></div>
				</article>`).join('') : '<div class="state"><strong>No objects found.</strong>Try a different search or category.</div>';
		}

		searchElement.addEventListener('input', renderProducts);
		categoryElement.addEventListener('change', renderProducts);
		sortElement.addEventListener('change', renderProducts);
		fetchProducts();
	</script>
</body>
</html>
